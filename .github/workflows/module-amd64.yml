name: module-amd64

# Builds the dynamic module .so on amd64 for both libc targets (Debian trixie
# glibc + Alpine musl) and verifies it loads + parses (`nginx -t`). Split into its
# own workflow so amd64 carries a dedicated status badge. arm64 is module-arm64.yml.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx: [mainline, stable]
        libc: [debian, alpine]
    steps:
      - uses: actions/checkout@v5
      - name: build module .so (${{ matrix.nginx }}/${{ matrix.libc }}/amd64)
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target module-build-${{ matrix.libc }}
      - name: nginx -t smoke (${{ matrix.nginx }}/${{ matrix.libc }}/amd64 — module loads, directives parse)
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target nginx-smoke-${{ matrix.libc }}
      - name: failed reload preserves verifier policy
        if: matrix.libc == 'debian'
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target security-reload
