name: module-arm64

# Builds the dynamic module .so on arm64 (native arm runner, no QEMU) for both
# libc targets (Debian trixie glibc + Alpine musl) and verifies it loads + parses
# (`nginx -t`). Split into its own workflow so arm64 carries a dedicated status
# badge. amd64 is module-amd64.yml.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        nginx: [mainline, stable]
        libc: [debian, alpine]
    steps:
      - uses: actions/checkout@v5
      - name: build module .so (${{ matrix.nginx }}/${{ matrix.libc }}/arm64)
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target module-build-${{ matrix.libc }}
      - name: nginx -t smoke (${{ matrix.nginx }}/${{ matrix.libc }}/arm64 — module loads, directives parse)
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target nginx-smoke-${{ matrix.libc }}
      - name: failed reload preserves verifier policy
        if: matrix.libc == 'debian'
        run: ./scripts/build-nginx.sh ${{ matrix.nginx }} --target security-reload
