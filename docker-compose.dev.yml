# Manual test sandbox: nginx + the module on http://localhost:8080 so you can
# poke the gate with a real browser (challenge page, solver progress, clearance
# cookie) or curl. Driven by ./scripts/dev.sh — see docs/testing.md.
#
# The config is volume-mounted (docker/nginx.dev.conf): edit it and
# `./scripts/dev.sh reload` — no rebuild. Rebuild only for module code changes.

# Own project name: without it this shares the default project (dir name) with
# docker-compose.test.yml, and a test run replaces the running sandbox container.
name: ngx-pow-dev

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # DEV_TARGET=nginx-smoke-alpine to poke the musl build instead
      target: ${DEV_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.7}"
        NGINX_SHA256: "${NGINX_SHA256:-89ea8a3dc171511f7325043b50e4c036248d9fad5feb7ec809c0b82d5df42c65}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:6c3fee1d7a4686ea271e9cc60d9c741cdfbc44ecf11d343025e1cff4c5522f47}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d}"
    ports:
      # 12222 to stay clear of the usual 8080 suspects (other local stacks)
      - "${DEV_PORT:-12222}:8080"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # Generated by scripts/dev.sh: assets/challenge.html + data-record-result
      # attribute on the solver tag (solve-result recording, test mode only).
      # Also exercises the pow_gate_page directive live.
      - ./docker/challenge.dev.html:/etc/pow/challenge.html:ro
