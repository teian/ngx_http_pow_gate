# Containerized performance run: nginx + module, then the load generator.
#   docker compose -f docker-compose.perf.yml up --build \
#     --abort-on-container-exit --exit-code-from perf
# Knobs: PERF_DURATION / PERF_CONCURRENCY / PERF_MODES (see docs/performance.md).

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.10}"
        NGINX_SHA256: "${NGINX_SHA256:-a9b690957fca84abdae8a9b52d66b1bb459282d7f01fe4b94b498ed8e977bdb3}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:a786635fd3c7b9a57ea089ab1c0713e510f3b548b65fe699ce3d59e4a926b37e}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae}"
    expose:
      - "8080"

  perf:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: perf
    environment:
      BASE_URL: "http://nginx:8080"
      PERF_DURATION: "${PERF_DURATION:-5}"
      PERF_CONCURRENCY: "${PERF_CONCURRENCY:-8}"
      PERF_MODES: "${PERF_MODES:-baseline,challenge,cleared,proof}"
    depends_on:
      nginx:
        condition: service_started
