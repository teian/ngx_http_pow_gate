# Containerized performance run: nginx + module, then the load generator.
#   docker compose -f docker-compose.perf.yml up --build \
#     --abort-on-container-exit --exit-code-from perf
# Knobs: PERF_DURATION / PERF_CONCURRENCY / PERF_MODES (see docs/performance.md).

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.7}"
        NGINX_SHA256: "${NGINX_SHA256:-89ea8a3dc171511f7325043b50e4c036248d9fad5feb7ec809c0b82d5df42c65}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:6c3fee1d7a4686ea271e9cc60d9c741cdfbc44ecf11d343025e1cff4c5522f47}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d}"
    expose:
      - "8080"

  perf:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: perf
    environment:
      BASE_URL: "http://nginx:8080"
      PERF_DURATION: "${PERF_DURATION:-5}"
      PERF_CONCURRENCY: "${PERF_CONCURRENCY:-8}"
      PERF_MODES: "${PERF_MODES:-baseline,challenge,cleared,proof}"
    depends_on:
      nginx:
        condition: service_started
