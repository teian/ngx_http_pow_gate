# Containerized performance run: nginx + module, then the load generator.
#   docker compose -f docker-compose.perf.yml up --build \
#     --abort-on-container-exit --exit-code-from perf
# Knobs: PERF_DURATION / PERF_CONCURRENCY / PERF_MODES (see docs/performance.md).

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.8}"
        NGINX_SHA256: "${NGINX_SHA256:-0652b760b3b772d2ec17b47c2fc15d9a95e6fe35cd5b877eadc1a62d9bc75af1}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:6e67f8eaac94fc456588d4ff6c470d984841f5b5dc4279863d5cbe6ec5a60def}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8}"
    expose:
      - "8080"

  perf:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: perf
    environment:
      BASE_URL: "http://nginx:8080"
      PERF_DURATION: "${PERF_DURATION:-5}"
      PERF_CONCURRENCY: "${PERF_CONCURRENCY:-8}"
      PERF_MODES: "${PERF_MODES:-baseline,challenge,cleared,proof}"
    depends_on:
      nginx:
        condition: service_started
