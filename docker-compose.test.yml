# Full live test: bring up nginx with the module, then run the black-box e2e
# client against it. `docker compose -f docker-compose.test.yml up --build
# --abort-on-container-exit --exit-code-from e2e` returns the e2e exit code, so
# CI can gate on it.

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # glibc (Debian trixie) by default; CI sets SMOKE_TARGET=nginx-smoke-alpine
      # to run the same handshake against the musl build.
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.8}"
        NGINX_SHA256: "${NGINX_SHA256:-0652b760b3b772d2ec17b47c2fc15d9a95e6fe35cd5b877eadc1a62d9bc75af1}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:6e67f8eaac94fc456588d4ff6c470d984841f5b5dc4279863d5cbe6ec5a60def}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8}"
    expose:
      - "8080"
      - "8443/udp"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    environment:
      BASE_URL: "http://nginx:8080"
      HTTP3_BASE_URL: "https://nginx:8443"
    depends_on:
      nginx:
        condition: service_started
