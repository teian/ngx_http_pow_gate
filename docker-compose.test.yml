# Full live test: bring up nginx with the module, then run the black-box e2e
# client against it. `docker compose -f docker-compose.test.yml up --build
# --abort-on-container-exit --exit-code-from e2e` returns the e2e exit code, so
# CI can gate on it.

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # glibc (Debian trixie) by default; CI sets SMOKE_TARGET=nginx-smoke-alpine
      # to run the same handshake against the musl build.
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.10}"
        NGINX_SHA256: "${NGINX_SHA256:-a9b690957fca84abdae8a9b52d66b1bb459282d7f01fe4b94b498ed8e977bdb3}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:a786635fd3c7b9a57ea089ab1c0713e510f3b548b65fe699ce3d59e4a926b37e}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae}"
    expose:
      - "8080"
      - "8443/udp"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    environment:
      BASE_URL: "http://nginx:8080"
      HTTP3_BASE_URL: "https://nginx:8443"
    depends_on:
      nginx:
        condition: service_started
