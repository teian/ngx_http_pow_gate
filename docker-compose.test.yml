# Full live test: bring up nginx with the module, then run the black-box e2e
# client against it. `docker compose -f docker-compose.test.yml up --build
# --abort-on-container-exit --exit-code-from e2e` returns the e2e exit code, so
# CI can gate on it.

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # glibc (Debian trixie) by default; CI sets SMOKE_TARGET=nginx-smoke-alpine
      # to run the same handshake against the musl build.
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.7}"
        NGINX_SHA256: "${NGINX_SHA256:-89ea8a3dc171511f7325043b50e4c036248d9fad5feb7ec809c0b82d5df42c65}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:6c3fee1d7a4686ea271e9cc60d9c741cdfbc44ecf11d343025e1cff4c5522f47}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d}"
    expose:
      - "8080"
      - "8443/udp"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    environment:
      BASE_URL: "http://nginx:8080"
      HTTP3_BASE_URL: "https://nginx:8443"
    depends_on:
      nginx:
        condition: service_started
