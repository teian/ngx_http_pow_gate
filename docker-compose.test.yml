# Full live test: bring up nginx with the module, then run the black-box e2e
# client against it. `docker compose -f docker-compose.test.yml up --build
# --abort-on-container-exit --exit-code-from e2e` returns the e2e exit code, so
# CI can gate on it.

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # glibc (Debian trixie) by default; CI sets SMOKE_TARGET=nginx-smoke-alpine
      # to run the same handshake against the musl build.
      target: ${SMOKE_TARGET:-nginx-smoke-debian}
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.31.9}"
        NGINX_SHA256: "${NGINX_SHA256:-a11c5eeee2e257f4478f0e649f84b0040787d277d2d3e5233952aa6b6dcb80ad}"
        NGINX_DEBIAN_DIGEST: "${NGINX_DEBIAN_DIGEST:-sha256:08f354a3b44c422021a5c0f5efb3e27f8f90236b5447d3bac4053f5f50ab6760}"
        NGINX_ALPINE_DIGEST: "${NGINX_ALPINE_DIGEST:-sha256:90b6bd2aec278b16b98221d64deb1d6d35d164567f507ab0716e6053878315aa}"
    expose:
      - "8080"
      - "8443/udp"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    environment:
      BASE_URL: "http://nginx:8080"
      HTTP3_BASE_URL: "https://nginx:8443"
    depends_on:
      nginx:
        condition: service_started
