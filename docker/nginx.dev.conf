# Config for the MANUAL test sandbox (docker-compose.dev.yml). Unlike
# nginx.test.conf (baked into the image for CI), this file is volume-mounted
# into the container — edit it and run `./scripts/dev.sh reload` to apply,
# no image rebuild needed.

load_module modules/ngx_http_pow_gate_module.so;

events {}

http {
    pow_gate_hmac_key_file /etc/pow/hmac.key;   # baked into the smoke image
    # Browsers hash via crypto.subtle, sequentially — far slower than native
    # (roughly 5-15s per 5000). Keep the solve inside the 120s challenge grace
    # window; drop to ~500 for near-instant clearance.
    pow_gate_difficulty    100000;
    pow_gate_clearance_ttl 12h;
    pow_gate_proof_skew    30s;
    pow_gate_endpoint      /.pow/;

    pow_gate_cookie_name     pow_clearance;
    pow_gate_cookie_samesite Lax;
    pow_gate_cookie_secure   off;    # plain HTTP on localhost
    pow_gate_cookie_httponly on;

    # Custom challenge page (tests the pow_gate_page directive). Uncomment the
    # matching volume mount in docker-compose.dev.yml, then this directive:
    # pow_gate_page /etc/pow/challenge.html;

    # Good-bot verifier against the loopback ranges feed (0.0.0.0/0, so any
    # client IP matches). Try it: curl -A verifierbot http://localhost:12222/
    pow_gate_verifier test {
        ip_ranges_url     http://127.0.0.1:8080/ranges.json;
        ip_ranges_refresh 1h;
        fcrdns_suffix     .example-bot.invalid;
        fcrdns_ttl        1h;
    }

    geo $pow_trusted {
        default 0;
        # Uncomment to test the trusted bypass from your machine (Docker
        # bridge / localhost source addresses):
        # 172.16.0.0/12 1;
        # 127.0.0.1     1;
    }
    map $http_user_agent $pow_decision {
        default              challenge;
        ~*verifierbot        verify:test;
        ~*denybot            deny;
    }

    server {
        listen 8080;
        server_name _;

        # Static file in the CONTENT phase stands in for the upstream (the gate
        # runs in ACCESS; `return` would run in REWRITE, before the gate).
        location / {
            pow_gate          on;
            pow_gate_trusted  $pow_trusted;
            pow_gate_decision $pow_decision;
            root  /var/www;
            index index.html;
            try_files /index.html =404;
        }

        # excluded path — must never be challenged
        location = /healthz {
            pow_gate off;
            root  /var/www;
            try_files /healthz.txt =404;
        }

        # IP-range feed for the verifier (gate off so the refresher can fetch it)
        location = /ranges.json {
            pow_gate off;
            root  /var/www;
            try_files /ranges.json =404;
            types { } default_type application/json;
        }
    }
}
