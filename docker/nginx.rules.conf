# `nginx -t` only: proves the bundled rules and the example includes parse
# against the module. Never started, so no feed is fetched.
load_module modules/ngx_http_pow_gate_module.so;
events { }
http {
    pow_gate_hmac_key_file /etc/pow/hmac.key;
    pow_gate_state_file    /var/tmp/pow_gate.state;

    include /etc/nginx/pow-rules/verifiers.conf;
    map $http_user_agent $pow_decision {
        default challenge;
        include /etc/nginx/pow-rules/ai-crawlers.map;
        include /etc/nginx/pow-rules/search-engines.map;
        include /etc/nginx/pow-rules/automation.map;
    }

    # Stand-in for the variable examples/asn-policy.conf takes from geoip2.
    map "" $pow_client_asn { default 0; }
    include /etc/nginx/pow-examples/link-previews.conf;
    include /etc/nginx/pow-examples/load-adaptive.conf;
    include /etc/nginx/pow-examples/scoring.conf;

    server {
        listen 8081;
        include /etc/nginx/pow-examples/metrics.conf;
        location / {
            pow_gate on;
            pow_gate_decision $pow_decision_with_previews;
            pow_gate_difficulty_scale $pow_load_scale;
            limit_req zone=pow_previews burst=6 nodelay;
            root /var/www;
        }
        location /scored/ {
            pow_gate on;
            pow_gate_endpoint /scored/.pow/;
            pow_gate_weights  $pow_weight_language $pow_weight_fetch_metadata $pow_weight_agent;
            pow_gate_decision $pow_score_decision;
            pow_gate_cookie_partitioned on;
            root /var/www;
        }
    }
}
