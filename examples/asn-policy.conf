# Optional ngx_http_geoip2_module integration. Load its .so at nginx's top level:
# load_module modules/ngx_http_geoip2_module.so;
# Include this file inside http {}. Install/update the ASN database separately.
# Configure trusted realip processing first; source=$remote_addr uses that result.
# https://github.com/leev/ngx_http_geoip2_module
geoip2 /var/lib/GeoIP/GeoLite2-ASN.mmdb {
    auto_reload 5m;
    $pow_client_asn default=0 source=$remote_addr autonomous_system_number;
}

# Replace these documentation-only ASNs with networks supported by your logs.
# Geography or ASN is a policy signal, never proof that a client is a good bot.
map $pow_client_asn $pow_network_tier {
    default normal;
    64496 elevated;
    64497 elevated;
}
map "$pow_network_tier:$http_user_agent" $pow_asn_decision {
    default challenge;
    ~*:(gptbot|bytespider|ccbot) deny;
    ~*:(googlebot|bingbot) verify:search_engines;
    ~^elevated: challenge:200000;
}

# In the SAME server/location scope for content AND /.pow/ endpoints:
# pow_gate_decision $pow_asn_decision;
# pow_gate_policy asn-v1;
# Existing geo/map trust configuration and regular rate limits still apply.
