# Link previews on gated pages. Include inside http {}, after asn-policy.conf
# (it defines $pow_client_asn) and after the map that defines $pow_decision.
#
# Chat apps and social networks fetch a shared URL once to read its title and
# Open Graph tags. Those fetchers run no JavaScript, so a gated page shows up
# without a preview. This file lets them through in two tiers:
#
#   * verified   — the fetcher's operator owns its network, so the claimed
#                  User-Agent is checked against the client's ASN.
#   * unverified — the fetcher runs on shared cloud addresses or on the
#                  sender's own device, so the User-Agent is all there is.
#
# Both tiers are rate-limited per address: a preview fetcher asks for a URL
# once, a scraper borrowing its User-Agent does not stop at twelve a minute.
# Be clear about what the unverified tier is: anyone can send that
# User-Agent. Delete its line if a bounded leak is not acceptable.

map $http_user_agent $pow_preview_fetcher {
    default                "";
    ~*facebookexternalhit  meta;
    ~*twitterbot           x;
    ~*linkedinbot          linkedin;
    ~*telegrambot          telegram;
    ~*(slackbot-linkexpanding|discordbot|whatsapp|mastodon|skypeuripreview|iframely|embedly)  unverified;
}

# ASN holders checked against RIPEstat on 2026-11-26. LinkedIn announces its
# crawler ranges from several ASNs; confirm against your own logs.
map "$pow_preview_fetcher:$pow_client_asn" $pow_preview_decision {
    default           "";
    meta:32934        allow;
    x:13414           allow;
    ~^linkedin:(14413|55163|40793|13443)$  allow;
    ~^telegram:(62041|62014|59930|44907|211157)$  allow;
    ~^unverified:     allow;
}

# A preview decision wins; everything else keeps the decision it had.
map $pow_preview_decision $pow_decision_with_previews {
    ""       $pow_decision;
    default  $pow_preview_decision;
}

# Only admitted previews are counted against the limit (an empty key is not
# limited), so regular visitors are unaffected.
map $pow_preview_decision $pow_preview_limit_key {
    default  "";
    allow    $binary_remote_addr;
}
limit_req_zone $pow_preview_limit_key zone=pow_previews:1m rate=12r/m;

# In the gated location (and the location serving its /.pow/ endpoints):
#     pow_gate_decision $pow_decision_with_previews;
#     limit_req         zone=pow_previews burst=6 nodelay;
