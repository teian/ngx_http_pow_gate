# Raise the price of a NEW clearance while the machine is busy. Include inside
# http {}.
#
# $pow_gate_load is the one-minute load average as a percentage of the CPUs
# available to nginx: 100 means every CPU is busy. ($pow_gate_load_1m is the
# raw value, for logging.)
#
# pow_gate_difficulty_scale multiplies the difficulty of challenges issued
# from now on. Clients that already hold a clearance keep it: a surcharge
# never sends your current visitors back to the challenge page.

map $pow_gate_load $pow_load_scale {
    default                1;   # below 100 %
    ~^1\d\d$               2;   # 100–199 %
    ~^[23]\d\d$            4;   # 200–399 %
    "~^([4-9]\d\d|\d{4,})$"  8;   # 400 % and above
}

# In the gated location (and the location serving its /.pow/ endpoints):
#     pow_gate_difficulty_scale $pow_load_scale;
