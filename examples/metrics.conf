# Outcome counters in the Prometheus text format. Include inside a server {}.
#
# The gate must be off here (a scraper cannot solve a challenge) and the
# location must not be public: the counters reveal how much traffic you
# refuse and why.

location = /pow_gate_status {
    pow_gate off;
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    pow_gate_status;
}
