# Include once inside http {}, before the site's server {} blocks.
# Starting budgets for a small dynamic site; size aggregate limits from measured
# application capacity. All servers using this include share one total budget.
# Resolve the real client address using trusted realip configuration first.
map $uri $regular_dynamic_ip {
    default $binary_remote_addr;
    ~*\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|map)$ "";
}
map $regular_dynamic_ip $regular_asset_ip {
    "" $binary_remote_addr;
    default "";
}
map $host $regular_global_key {
    default regular-global;
}

limit_req_zone $regular_dynamic_ip zone=regular_dynamic:2m rate=5r/s;
limit_req_zone $regular_asset_ip zone=regular_assets:2m rate=40r/s;
limit_req_zone $regular_global_key zone=regular_total:64k rate=200r/s;
limit_conn_zone $binary_remote_addr zone=regular_connections:1m;
limit_conn_zone $regular_global_key zone=regular_total_connections:64k;

limit_req zone=regular_dynamic burst=20 nodelay;
limit_req zone=regular_assets burst=80 nodelay;
limit_req zone=regular_total burst=100 delay=50;
limit_req_status 429;
limit_req_log_level notice;
limit_conn regular_connections 32;
limit_conn regular_total_connections 300;
limit_conn_status 429;
limit_conn_log_level notice;

# Inspect $limit_req_status / $limit_conn_status in logs before enforcing these
# initial budgets. Change both to off after tuning from representative traffic.
limit_req_dry_run on;
limit_conn_dry_run on;

client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
keepalive_requests 1000;
client_max_body_size 1m;
