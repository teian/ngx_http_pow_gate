# Combine several weak signals into one decision. Include inside http {}.
#
# A map yields one value from one input. pow_gate_weights adds up any number
# of them: each argument is an integer (anything else counts as 0) and the
# total is exposed as $pow_gate_score. Positive means more suspicious.

map $http_accept_language $pow_weight_language {
    default  0;
    ""       10;    # browsers always send one
}
map $http_sec_fetch_mode $pow_weight_fetch_metadata {
    default  0;
    ""       5;     # every current browser sends fetch metadata
}
map $http_user_agent $pow_weight_agent {
    default       0;
    ~*headless    15;
    ~*(curl|wget) 10;
}

# Score bands → decision. Regexes are tried in order; the first match wins.
map $pow_gate_score $pow_score_decision {
    default        challenge;          # 10–19: the configured difficulty
    ~^-            allow;              # negative: a signal vouched for the client
    ~^\d$          challenge:js;       # 0–9: looks like a browser, cheap check
    ~^[2-9]\d$     challenge:400000;   # 20–99: make it expensive
    "~^\d{3,}$"    deny;               # 100 and above
}

# In the gated location (and the location serving its /.pow/ endpoints):
#     pow_gate_weights  $pow_weight_language $pow_weight_fetch_metadata $pow_weight_agent;
#     pow_gate_decision $pow_score_decision;
