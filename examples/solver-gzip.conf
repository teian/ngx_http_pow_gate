# Optional include INSIDE the server that uses the default /.pow/ endpoint.
# Keep shared pow_gate_* settings at http/server scope so this location inherits
# the same endpoint/policy. Adapt the exact URI if pow_gate_endpoint is changed.
# nginx still negotiates Accept-Encoding, including gzip;q=0 and HEAD.
location = /.pow/solver.js {
    pow_gate on;
    gzip on;
    gzip_types text/javascript;
    gzip_vary on;
}
