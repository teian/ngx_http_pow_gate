# Verified good-bot allowlists for ngx_http_pow_gate. Include inside http {}:
#
#     include /etc/nginx/pow-rules/verifiers.conf;
#
# A verifier confirms that a client claiming a crawler's User-Agent really
# connects from that crawler's network: its published IP-range feed, or
# forward-confirmed reverse DNS. A spoofed User-Agent fails both and is
# challenged like any other client. Pair this file with search-engines.map.
#
# Feeds were checked on 2026-11-26. All use the {"prefixes":[{"ipv4Prefix":…}]}
# layout the module parses. Delete a block you do not reference: every
# verifier with a feed runs one refresher thread per worker.

# General web search. Google, Bing, DuckDuckGo and Apple publish ranges;
# Yandex and Baidu document reverse-DNS suffixes instead.
pow_gate_verifier search_engines {
    ip_ranges_url      https://developers.google.com/static/crawling/ipranges/common-crawlers.json;
    ip_ranges_url      https://developers.google.com/static/crawling/ipranges/special-crawlers.json;
    ip_ranges_url      https://www.bing.com/toolbox/bingbot.json;
    ip_ranges_url      https://duckduckgo.com/duckduckbot.json;
    ip_ranges_url      https://search.developer.apple.com/applebot.json;
    ip_ranges_refresh  12h;
    fcrdns_suffix      .googlebot.com .google.com .search.msn.com .applebot.apple.com
                       .yandex.ru .yandex.net .yandex.com .baidu.com .baidu.jp;
    fcrdns_ttl         1h;
}

# AI-backed search indexes: they crawl to answer with a link back to you, not
# to train a model. Used by the optional section of ai-crawlers.map.
pow_gate_verifier ai_search {
    ip_ranges_url      https://openai.com/searchbot.json;
    ip_ranges_url      https://www.perplexity.com/perplexitybot.json;
    ip_ranges_refresh  12h;
}

# Fetches made on behalf of one person asking an assistant about your page.
pow_gate_verifier ai_user_fetch {
    ip_ranges_url      https://openai.com/chatgpt-user.json;
    ip_ranges_url      https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json;
    ip_ranges_refresh  12h;
}
